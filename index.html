    <script>
      // Always open at the top so the Kyle boot sequence plays.
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      // Preview aid: ?motion forces full motion even when the OS asks for reduced motion.
      if (new URLSearchParams(location.search).has("motion")) {
        const mm = window.matchMedia.bind(window);
        window.matchMedia = (q) =>
          q.includes("reduced-motion")
            ? { matches: false, media: q, onchange: null, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {}, dispatchEvent() { return false; } }
            : mm(q);
      }
    </script>
